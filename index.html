<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%96%8B%EF%B8%8F%3C/text%3E%3C/svg%3E"
    />
    <meta
      name="description"
      content="ChatGPT・Claude などの AI に小説制作を依頼するための、高品質な小説構築プロンプトを生成するツール"
    />
    <title>AI Novel Prompt Builder</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 20px">
        このアプリの動作には JavaScript が必要です。ブラウザの設定で JavaScript
        を有効にしてください。
      </div>
    </noscript>
    <script>
      // 起動に失敗したとき、白い画面ではなくエラー内容を表示する
      window.addEventListener("error", function (event) {
        var root = document.getElementById("root");
        if (!root || root.childElementCount > 0) return;
        root.innerHTML =
          '<div style="font-family:sans-serif;max-width:640px;margin:40px auto;padding:20px 24px;border:1px solid #c0392b;border-radius:8px;background:#fff;color:#333">' +
          "<h2 style=\"margin-top:0;color:#c0392b\">アプリの起動に失敗しました</h2>" +
          "<p>お使いのブラウザが古い可能性があります。最新の Chrome / Edge / Firefox / Safari でこのファイルを開き直してください。</p>" +
          '<p style="font-size:12px;color:#777;word-break:break-all">エラー: ' +
          (event.message || event.type || "不明") +
          "<br>ブラウザ: " +
          navigator.userAgent +
          "</p></div>";
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
